
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mizlish — Your Business AI Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --green:#1AB8FC; --green-d:#0E94D9; --green-l:#E0F4FF;
  --orange:#E4248F; --orange-d:#B81A72; --orange-l:#FCE0EE;
  --purple:#6C21C7; --purple-d:#541A9E; --purple-l:#EDE3FA;
  --navy:#051D4F;
  --bg:#f8faf9; --surface:#ffffff; --border:#e5e9ec;
  --text:#0f172a; --text-dim:#64748b; --text-mute:#94a3b8;
  --red:#dc2626; --amber:#d97706; --blue:#0284c7;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px -10px rgba(0,0,0,.15);
  --radius:14px; --radius-sm:10px;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--green-d);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:248px;flex-shrink:0;background:linear-gradient(180deg,#051D4F 0%,#02134A 100%);color:#fff;display:flex;flex-direction:column;transition:transform .25s}
.sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand .logo{display:flex;align-items:center;gap:10px}
.sidebar-brand .logo-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--green) 0%,var(--purple) 50%,var(--orange) 100%);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;box-shadow:0 4px 12px rgba(26,184,252,.4)}
.sidebar-brand .logo-mark-img{width:40px;height:auto;border-radius:8px;flex-shrink:0}
.sidebar-brand h1{font-size:15px;font-weight:700;letter-spacing:-.2px}
.sidebar-brand p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.nav{flex:1;padding:14px 10px;overflow-y:auto}
.nav-section{margin-bottom:16px}
.nav-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.35);padding:0 12px;margin-bottom:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.7);font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(26,184,252,.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(26,184,252,.3)}
.nav-item .icon{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item .badge{margin-left:auto;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px}
.topbar .menu-toggle{display:none;font-size:20px;color:var(--text-dim)}
.topbar h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
.topbar .search{flex:1;max-width:340px;margin-left:auto;position:relative}
.topbar .search input{width:100%;padding:9px 14px 9px 36px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
.topbar .search input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(26,184,252,.1)}
.topbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-mute)}
.topbar .actions{display:flex;align-items:center;gap:10px}
.topbar .icon-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);border:1px solid var(--border);background:var(--surface);position:relative}
.topbar .icon-btn:hover{border-color:var(--green);color:var(--green-d)}
.topbar .icon-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--orange);border-radius:50%;border:2px solid var(--surface)}
.topbar .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--orange));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}

.content{flex:1;overflow-y:auto;padding:24px}
.view{display:none;max-width:1100px;margin:0 auto}
.view.active{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards & components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-hd{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-hd h3{font-size:14px;font-weight:700}
.card-bd{padding:20px}
.card-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* KPI cards */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--green)}
.kpi.orange::before{background:var(--orange)}
.kpi.blue::before{background:var(--blue)}
.kpi.red::before{background:var(--red)}
.kpi .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim)}
.kpi .value{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--text-mute);margin-top:2px}
.kpi .sub.up{color:var(--green-d)}
.kpi .sub.down{color:var(--red)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-d)}
.btn-orange{background:var(--orange);color:#fff}
.btn-orange:hover{background:var(--orange-d)}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text-dim)}
.btn-outline:hover{border-color:var(--green);color:var(--green-d)}
.btn-ghost{color:var(--text-dim)}
.btn-ghost:hover{color:var(--text)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-icon{padding:6px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Forms */
.form-row{display:grid;gap:12px;margin-bottom:14px}
.form-row.cols-2{grid-template-columns:1fr 1fr}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.form-row.cols-2,.form-row.cols-3{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);transition:all .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(26,184,252,.1)}
textarea{resize:vertical;min-height:70px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:10px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr:hover{background:var(--bg)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* Badges & pills */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:capitalize}
.badge-green{background:var(--green-l);color:var(--green-d)}
.badge-orange{background:var(--orange-l);color:var(--orange-d)}
.badge-red{background:#fee2e2;color:var(--red)}
.badge-blue{background:#e0f2fe;color:var(--blue)}
.badge-gray{background:#f1f5f9;color:var(--text-dim)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(2px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.modal-hd{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-hd h3{font-size:16px;font-weight:700}
.modal-hd .close{font-size:22px;color:var(--text-mute);line-height:1}
.modal-bd{padding:22px;max-height:60vh;overflow-y:auto}
.modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--text);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:toastIn .25s;display:flex;align-items:center;gap:8px;max-width:360px}
.toast.success{background:var(--green-d)}
.toast.error{background:var(--red)}
.toast.info{background:var(--blue)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* Section headers */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sec-hd h2{font-size:22px;font-weight:800;letter-spacing:-.5px}
.sec-hd .desc{font-size:13px;color:var(--text-dim);margin-top:2px}
.sec-actions{display:flex;gap:8px}

/* AI Assistant */
.ai-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;height:calc(100vh - 180px);min-height:420px}
.ai-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.ai-msg{max-width:78%;padding:12px 16px;border-radius:14px;font-size:13.5px;line-height:1.6}
.ai-msg.bot{background:var(--green-l);border:1px solid #E0F4FF;align-self:flex-start;border-bottom-left-radius:4px}
.ai-msg.user{background:var(--orange-l);border:1px solid #E0F4FF;align-self:flex-end;border-bottom-right-radius:4px}
.ai-input{border-top:1px solid var(--border);padding:12px;display:flex;gap:8px}
.ai-input input{flex:1}
.ai-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.ai-chip{font-size:12px;padding:5px 11px;border:1px solid var(--border);border-radius:20px;color:var(--text-dim);cursor:pointer;background:var(--bg)}
.ai-chip:hover{border-color:var(--green);color:var(--green-d);background:var(--green-l)}

/* Misc */
.empty{text-align:center;padding:40px 20px;color:var(--text-mute)}
.empty .ic{font-size:36px;margin-bottom:8px}
.flex{display:flex}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.gap-8{gap:8px}.gap-12{gap:12px}.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mb-16{margin-bottom:16px}
.text-dim{color:var(--text-dim)}.text-mute{color:var(--text-mute)}
.text-green{color:var(--green-d)}.text-orange{color:var(--orange-d)}.text-red{color:var(--red)}
.text-right{text-align:right}.text-center{text-align:center}
.fw-700{font-weight:700}.fw-800{font-weight:800}
.fs-12{font-size:12px}.fs-11{font-size:11px}
.hidden{display:none!important}

/* Progress */
.progress{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--purple),var(--orange));border-radius:4px;transition:width .4s}
.progress-bar.orange{background:linear-gradient(90deg,var(--orange),var(--orange-d))}

/* Summary feed */
.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.feed-item:last-child{border:none}
.feed-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.feed-dot.green{background:var(--green)}.feed-dot.orange{background:var(--orange)}.feed-dot.red{background:var(--red)}.feed-dot.blue{background:var(--blue)}
.feed-body{flex:1}
.feed-body .title{font-size:13px;font-weight:600}
.feed-body .meta{font-size:12px;color:var(--text-mute);margin-top:1px}

/* Settings rows */
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border:none}
.set-row .info h4{font-size:13.5px;font-weight:600}
.set-row .info p{font-size:12px;color:var(--text-dim);margin-top:2px;max-width:380px}
.switch{position:relative;width:42px;height:24px;background:#cbd5e1;border-radius:12px;cursor:pointer;transition:.2s;flex-shrink:0}
.switch.on{background:var(--green)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}

/* Chart container */
.chart-wrap{position:relative;height:280px}

/* Balance Sheet */
.bs-table{width:100%;border-collapse:collapse;font-size:13px}
.bs-table th{background:var(--orange-l);color:var(--orange-d);padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;text-align:left}
.bs-table td{padding:9px 14px;border-bottom:1px solid var(--border)}
.bs-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bs-table tr.bs-total td{background:var(--orange-l);font-weight:800;border-top:2px solid var(--orange)}
.bs-table tr.bs-subtotal td{background:#F5E6FA;font-weight:700}
.bs-section td{background:#F5E6FA;color:var(--orange-d);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.bs-table tr:hover td{background:rgba(26,184,252,.03)}
.bs-table tr.bs-total:hover td{background:var(--orange-l)}
.bs-table tr.bs-section:hover td{background:#F5E6FA}

/* Stepper */
.stepper{display:flex;gap:0;margin-bottom:24px;flex-wrap:wrap}
.step{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;position:relative;transition:all .2s}
.step:not(:last-child)::after{content:'';position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:16px;height:2px;background:var(--border)}
.step.active{border-color:var(--orange);background:var(--orange-l);box-shadow:0 0 0 3px rgba(26,184,252,.1)}
.step.done{border-color:var(--orange);background:var(--orange-l)}
.step.done .step-num{background:var(--orange);color:#fff}
.step .step-num{width:30px;height:30px;border-radius:50%;background:var(--bg);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;transition:all .2s}
.step.active .step-num{background:var(--orange);color:#fff;border-color:var(--orange)}
.step .step-info h4{font-size:12.5px;font-weight:700}
.step .step-info p{font-size:11px;color:var(--text-dim);margin-top:1px}
@media(max-width:768px){.stepper{flex-direction:column}.step:not(:last-child)::after{display:none}}

/* Download card */
.dl-card{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);transition:all .2s}
.dl-card:hover{border-color:var(--orange);box-shadow:var(--shadow)}
.dl-icon{width:44px;height:44px;border-radius:10px;background:var(--orange-l);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dl-card .info h4{font-size:13.5px;font-weight:700}
.dl-card .info p{font-size:12px;color:var(--text-dim);margin-top:2px}

/* Period selector */
.period-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.period-tab{padding:7px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .15s}
.period-tab:hover{border-color:var(--orange);color:var(--orange-d)}
.period-tab.active{background:var(--orange);color:#fff;border-color:var(--orange)}

/* Checklist */
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.checklist-item:last-child{border:none}
.checklist-item .check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;margin-top:1px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.checklist-item.checked .check{background:var(--orange);border-color:var(--orange)}
.checklist-item .ci-info h4{font-size:13px;font-weight:600}
.checklist-item .ci-info p{font-size:12px;color:var(--text-dim);margin-top:2px}
.checklist-item.checked .ci-info h4{color:var(--text-dim);text-decoration:line-through}

/* Bank Statement Upload */
.upload-zone{border:2px dashed var(--border);border-radius:16px;padding:48px 32px;text-align:center;transition:all .25s;cursor:pointer;background:var(--surface);position:relative;overflow:hidden}
.upload-zone:hover{border-color:var(--green);background:var(--green-l)}
.upload-zone.dragover{border-color:var(--orange);background:var(--orange-l);transform:scale(1.01)}
.upload-zone .uz-icon{width:64px;height:64px;border-radius:16px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;box-shadow:0 6px 20px rgba(26,184,252,.25)}
.upload-zone h3{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--text-dim);margin-bottom:16px}
.upload-zone .uz-formats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.upload-zone .uz-format{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--bg);color:var(--text-dim);border:1px solid var(--border)}
.upload-zone input[type=file]{display:none}

/* Bank transaction table */
.txn-table{width:100%;border-collapse:collapse;font-size:12.5px}
.txn-table th{background:var(--navy);color:#fff;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;text-align:left;position:sticky;top:0}
.txn-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.txn-table tr:hover td{background:rgba(26,184,252,.03)}
.txn-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.txn-table .cat-select{font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);max-width:130px}
.txn-table .credit{color:var(--green-d)}
.txn-table .debit{color:var(--red)}
.txn-table .txn-wrap{max-width:1100px;overflow:auto;max-height:400px;border:1px solid var(--border);border-radius:10px}

/* ITR Balance Sheet */
.itr-table{width:100%;border-collapse:collapse;font-size:13px}
.itr-table th{background:var(--gradient);color:#fff;padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;text-align:left}
.itr-table td{padding:9px 14px;border-bottom:1px solid var(--border)}
.itr-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.itr-table tr.itr-section td{background:var(--navy);color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.itr-table tr.itr-subtotal td{background:#F0F6FF;font-weight:700}
.itr-table tr.itr-total td{background:var(--green-l);font-weight:800;border-top:2px solid var(--green)}
.itr-table tr:hover td{background:rgba(26,184,252,.03)}
.itr-table tr.itr-section:hover td{background:var(--navy)}
.itr-table tr.itr-total:hover td{background:var(--green-l)}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:fixed;z-index:50;transform:translateX(-100%);height:100vh}
  .sidebar.open{transform:none}
  .topbar .menu-toggle{display:block}
  .topbar .search{max-width:200px}
  .content{padding:16px}
}
</style>

function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function daysAhead(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

// ============== UTILS ==============
const fmtINR = n => '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const fmtDate = s => { if(!s) return '-'; const d=new Date(s); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const today = ()=> new Date().toISOString().slice(0,10);
function custName(id){ const c=DB.get('customers').find(x=>x.id===id); return c?c.name:'Unknown'; }
function custCompany(id){ const c=DB.get('customers').find(x=>x.id===id); return c?c.company:''; }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,m=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m])); }

function toast(msg, type='success'){
  const t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},3000);
}

function openModal(html){

}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); }

// ============== VIEWS ==============
const VIEWS = {};

VIEWS.dashboard = function(){
  const sales=DB.get('sales'), expenses=DB.get('expenses'), invoices=DB.get('invoices'), inv=DB.get('inventory');
  const todaySales = sales.filter(s=>s.date===today()).reduce((a,s)=>a+s.total,0);
  const monthSales = sales.filter(s=>s.date.slice(0,7)===today().slice(0,7)).reduce((a,s)=>a+s.total,0);
  const monthExp = expenses.filter(e=>e.date.slice(0,7)===today().slice(0,7)).reduce((a,e)=>a+e.amount,0);
  const profit = monthSales - monthExp;
  const overdue = invoices.filter(i=>i.status==='overdue').length;
  const lowStock = inv.filter(i=>i.qty<=i.minQty).length;
  const pendingInv = invoices.filter(i=>i.status!=='paid').length;

  return `
  <div class="view active">
    <div class="sec-hd"><div><h2>Welcome back, Annamalai</h2><div class="desc">Here's your business at a glance — ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div></div>
      <div class="sec-actions"><button class="btn btn-primary btn-sm" onclick="switchView('ai')">Ask AI</button><button class="btn btn-outline btn-sm" onclick="switchView('daily')">Daily Summary</button></div></div>

    <div class="grid grid-4 mb-16">
      <div class="kpi"><div class="label">Today's Sales</div><div class="value">${fmtINR(todaySales)}</div><div class="sub">${sales.filter(s=>s.date===today()).length} orders today</div></div>
      <div class="kpi orange"><div class="label">This Month Sales</div><div class="value">${fmtINR(monthSales)}</div><div class="sub up">${sales.filter(s=>s.date.slice(0,7)===today().slice(0,7)).length} orders</div></div>
      <div class="kpi blue"><div class="label">Monthly Expenses</div><div class="value">${fmtINR(monthExp)}</div><div class="sub">Net: ${fmtINR(profit)}</div></div>
      <div class="kpi red"><div class="label">Pending Invoices</div><div class="value">${pendingInv}</div><div class="sub">${overdue} overdue</div></div>
    </div>

    <div class="grid grid-2 mb-16">
      <div class="card">
        <div class="card-hd"><h3>Sales vs Expenses (This Month)</h3></div>
        <div class="card-bd"><div class="chart-wrap"><canvas id="dashChart1"></canvas></div></div>
      </div>
      <div class="card">
        <div class="card-hd"><h3>Recent Activity</h3></div>
        <div class="card-bd" id="activity-feed">${renderActivityFeed()}</div>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="card">
        <div class="card-hd"><h3>Top Customers</h3></div>
        <div class="card-bd">${renderTopCustomers()}</div>
      </div>
      <div class="card">
        <div class="card-hd"><h3>Inventory Alerts</h3></div>
        <div class="card-bd">${lowStock>0?inv.filter(i=>i.qty<=i.minQty).map(i=>`<div class="flex-between mb-16"><div><div class="fw-700">${escapeHtml(i.name)}</div><div class="fs-12 text-dim">Only ${i.qty} ${i.unit} left (min: ${i.minQty})</div></div><span class="badge badge-red">Low</span></div>`).join(''):'<div class="empty">All items well stocked</div>'}</div>
      </div>
      <div class="card">
        <div class="card-hd"><h3>Quick Actions</h3></div>
        <div class="card-bd" style="display:grid;gap:8px">
          <button class="btn btn-primary" onclick="openSaleModal()">+ New Sale</button>
          <button class="btn btn-orange" onclick="openExpenseModal()">+ Add Expense</button>
          <button class="btn btn-outline" onclick="openInvoiceModal()">+ Create Invoice</button>
          <button class="btn btn-outline" onclick="openQuotationModal()">+ Make Quotation</button>
          <button class="btn btn-outline" onclick="openCustomerModal()">+ Add Customer</button>
        </div>
      </div>
    </div>
  </div>`;
};

function renderActivityFeed(){
  const items=[];
  DB.get('sales').slice(-3).reverse().forEach(s=>items.push({dot:'green',title:`Sale: ${fmtINR(s.total)} — ${custName(s.customerId)}`,meta:fmtDate(s.date)}));
  DB.get('expenses').slice(-2).reverse().forEach(e=>items.push({dot:'orange',title:`Expense: ${fmtINR(e.amount)} — ${e.category}`,meta:fmtDate(e.date)}));
  DB.get('invoices').filter(i=>i.status==='overdue').forEach(i=>items.push({dot:'red',title:`Overdue: ${fmtINR(i.amount)} — ${custName(i.customerId)}`,meta:'Due '+fmtDate(i.dueDate)}));
  if(!items.length) return '<div class="empty">No recent activity</div>';
  return items.map(i=>`<div class="feed-item"><div class="feed-dot ${i.dot}"></div><div class="feed-body"><div class="title">${escapeHtml(i.title)}</div><div class="meta">${i.meta}</div></div></div>`).join('');
}

function renderTopCustomers(){
  const map={};
  DB.get('sales').forEach(s=>{ map[s.customerId]=(map[s.customerId]||0)+s.total; });
  const top=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!top.length) return '<div class="empty">No sales yet</div>';
  return top.map(([id,val])=>`<div class="flex-between mb-16"><div><div class="fw-700">${escapeHtml(custName(id))}</div><div class="fs-12 text-dim">${escapeHtml(custCompany(id))}</div></div><div class="fw-700 text-green">${fmtINR(val)}</div></div>`).join('');
}

function openSaleModal(){
  const customers=DB.get('customers');
  const inv=DB.get('inventory');
  openModal(`
    <div class="modal-hd"><h3>New Sale</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-bd">
      <div class="form-row cols-2">
        <div><label>Customer</label><select id="sale-customer">${customers.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} — ${escapeHtml(c.company)}</option>`).join('')}</select></div>
        <div><label>Date</label><input type="date" id="sale-date" value="${today()}"></div>
      </div>
      <div class="form-row cols-2">
        <div><label>Item</label><select id="sale-item">${inv.map(i=>`<option value="${i.id}" data-price="${i.price}" data-name="${escapeHtml(i.name)}" data-qty="${i.qty}">${escapeHtml(i.name)} (₹${i.price}, ${i.qty} in stock)</option>`).join('')}</select></div>
        <div><label>Quantity</label><input type="number" id="sale-qty" value="1" min="1" oninput="calcSaleTotal()"></div>
      </div>
      <div class="form-row cols-2">
        <div><label>Unit Price (₹)</label><input type="number" id="sale-price" value="${inv[0]?.price||0}" oninput="calcSaleTotal()"></div>
        <div><label>Total</label><input type="text" id="sale-total" value="₹${inv[0]?.price||0}" readonly></div>
      </div>
      <div class="form-row cols-2">
        <div><label>Payment Status</label><select id="sale-status"><option value="paid">Paid</option><option value="pending">Pending</option><option value="partial">Partial</option></select></div>
        <div><label>Payment Mode</label><select id="sale-mode"><option>UPI</option><option>Cash</option><option>Bank</option><option>Card</option></select></div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSale()">Save Sale</button>
    </div>`);
  const itemSel=document.getElementById('sale-item');
  if(itemSel){ itemSel.addEventListener('change',()=>{ const o=itemSel.options[itemSel.selectedIndex]; document.getElementById('sale-price').value=o.dataset.price; calcSaleTotal(); }); }
}
function calcSaleTotal(){ const q=+document.getElementById('sale-qty').value||0; const p=+document.getElementById('sale-price').value||0; document.getElementById('sale-total').value='₹'+(q*p); }
function saveSale(){
  const cust=document.getElementById('sale-customer').value;
  const itemSel=document.getElementById('sale-item');
  const o=itemSel.options[itemSel.selectedIndex];
  const qty=+document.getElementById('sale-qty').value;
  const price=+document.getElementById('sale-price').value;
  if(!qty||!price){ toast('Please enter quantity and price','error'); return; }
  const sale={id:DB.uid(),customerId:cust,date:document.getElementById('sale-date').value,items:[{name:o.dataset.name,qty,price}],total:qty*price,status:document.getElementById('sale-status').value,paymentMode:document.getElementById('sale-mode').value};
  const sales=DB.get('sales'); sales.push(sale); DB.set('sales',sales);
  // Reduce inventory
  const inv=DB.get('inventory'); const ix=inv.findIndex(i=>i.id===cust===o.value?false:i.id===o.value); 
  const item=inv.find(i=>i.id===o.value); if(item){ item.qty=Math.max(0,item.qty-qty); DB.set('inventory',inv); }
  closeModal(); refreshView(); toast('Sale saved successfully!','success');
  updateBadges();
}
function whatsappSale(id){
  const s=DB.get('sales').find(x=>x.id===id); if(!s)return;
  const text=`*Sale Receipt*\n\nCustomer: ${custName(s.customerId)}\nDate: ${fmtDate(s.date)}\nItems: ${s.items.map(i=>i.qty+'× '+i.name+' @ ₹'+i.price).join(', ')}\nTotal: ${fmtINR(s.total)}\nStatus: ${s.status}\n\nThank you for your business!`;
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}

VIEWS.expenses = function(){
  const exp=DB.get('expenses');
  const total=exp.reduce((a,e)=>a+e.amount,0);
  return `
  <div class="view active">
    <div class="sec-hd"><div><h2>Expenses</h2><div class="desc">Total: ${fmtINR(total)} across ${exp.length} entries</div></div>
      <div class="sec-actions"><button class="btn btn-orange btn-sm" onclick="openExpenseModal()">+ Add Expense</button></div></div>
    <div class="grid grid-3 mb-16">
      ${expenseBreakdown(exp)}
    </div>
    <div class="card">
      <div class="card-hd"><h3>Expense History</h3></div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th>Mode</th><th></th></tr></thead>
        <tbody>${exp.slice().reverse().map(e=>`<tr><td>${fmtDate(e.date)}</td><td><span class="badge badge-orange">${escapeHtml(e.category)}</span></td><td>${escapeHtml(e.desc)}</td><td class="num fw-700">${fmtINR(e.amount)}</td><td class="fs-12">${e.mode}</td><td><button class="btn btn-ghost btn-icon btn-sm" onclick="deleteExpense('${e.id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No expenses recorded</div></td></tr>'}</tbody>
      </table></div>
    </div>
  </div>`;
};
function expenseBreakdown(exp){
  const cats={};
  exp.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);
  const total=exp.reduce((a,e)=>a+e.amount,0)||1;
  const colors=['#1AB8FC','#E4248F','#6C21C7','#0E94D9','#B81A72','#541A9E','#8F64FA'];
  return Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([cat,amt],i)=>`
    <div class="kpi ${i===0?'orange':''}"><div class="label">${escapeHtml(cat)}</div><div class="value">${fmtINR(amt)}</div><div class="sub">${((amt/total)*100).toFixed(0)}% of total</div></div>
  `).join('');
}
function openExpenseModal(){
  openModal(`<div class="modal-hd"><h3>Add Expense</h3><button class="close" onclick="closeModal()">×</button></div>
  <div class="modal-bd">
    <div class="form-row cols-2">
      <div><label>Category</label><select id="exp-cat"><option>Raw Materials</option><option>Rent</option><option>Salaries</option><option>Utilities</option><option>Transport</option><option>Marketing</option><option>Maintenance</option><option>Other</option></select></div>
      <div><label>Amount (₹)</label><input type="number" id="exp-amount" placeholder="0"></div>
    </div>
    <div class="form-row cols-2">
      <div><label>Date</label><input type="date" id="exp-date" value="${today()}"></div>
      <div><label>Payment Mode</label><select id="exp-mode"><option>UPI</option><option>Cash</option><option>Bank</option><option>Card</option></select></div>
    </div>
    <div><label>Description</label><textarea id="exp-desc" placeholder="What was this expense for?"></textarea></div>
  </div>
  <div class="modal-ft"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-orange" onclick="saveExpense()">Save</button></div>`);
}
function saveExpense(){
  const amt=+document.getElementById('exp-amount').value;
  if(!amt){toast('Please enter amount','error');return;}
  const e={id:DB.uid(),category:document.getElementById('exp-cat').value,desc:document.getElementById('exp-desc').value,amount:amt,date:document.getElementById('exp-date').value,mode:document.getElementById('exp-mode').value};
  const exp=DB.get('expenses'); exp.push(e); DB.set('expenses',exp);
  closeModal(); refreshView(); toast('Expense added!','success');
}
function deleteExpense(id){ if(confirm('Delete this expense?')){ DB.set('expenses',DB.get('expenses').filter(e=>e.id!==id)); refreshView(); toast('Expense deleted','info'); } }

// GSTIN validation (checksum)
function validateGSTIN(gstin){
  if(!gstin) return false;
  if(gstin.length!==15) return false;
  const r='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let s=0, f=1;
  for(let i=0;i<14;i++){ const v=r.indexOf(gstin[i]); s+=f*v; f=f===1?2:1; }
  const c=14-(s%15); const check=r[c===14?0:c];
  return check===gstin[14];
}
function verifyGST(gstin){
  if(!gstin){ toast('No GSTIN provided','error'); return; }
  if(!validateGSTIN(gstin)){ toast('GSTIN format invalid (failed checksum)','error'); return; }
  const s=DB.get('settings');
  if(!s.gstinApiKey){ toast('Add a GSTIN API key in Settings for live verification. Format is valid (checksum passed).','info'); return; }
  toast('Checking GSTIN live...','info');
  fetch('https://api.gstinapi.in/v1/gstin/'+gstin,{headers:{'x-api-key':s.gstinApiKey}})
    .then(r=>r.json()).then(d=>{
      if(d.legal_name){ toast('Verified: '+d.legal_name+' ('+d.status+')','success'); }
      else { toast('Could not verify GSTIN','error'); }
    }).catch(()=>toast('API error. Check your key.','error'));
}

function getMonthList(){ const m=[]; for(let i=11;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); m.push(d.toISOString().slice(0,7)); } return m; }
function getYearList(){ const y=[]; for(let i=2;i>=0;i--){ y.push(String(new Date().getFullYear()-i)); } return y; }
function monthName(ym){ const d=new Date(ym+'-01'); return d.toLocaleDateString('en-IN',{month:'short',year:'numeric'}); }

function getFinancialData(period){
  const sales=DB.get('sales'), exp=DB.get('expenses'), inv=DB.get('inventory');
  const periodSales=sales.filter(s=>s.date.slice(0,period.length)===period);
  const periodExp=exp.filter(e=>e.date.slice(0,period.length)===period);
  const totalSales=periodSales.reduce((a,s)=>a+s.total,0);
  const totalExp=periodExp.reduce((a,e)=>a+e.amount,0);
  // Group expenses by category
  const expByCat={}; periodExp.forEach(e=>expByCat[e.category]=(expByCat[e.category]||0)+e.amount);
  // Group sales by customer
  const salesByCust={}; periodSales.forEach(s=>salesByCust[s.customerId]=(salesByCust[s.customerId]||0)+s.total);
  // Stock value
  const stockVal=inv.reduce((a,i)=>a+i.qty*i.cost,0);
  // Customer dues
  const dues=DB.get('customers').reduce((a,c)=>a+(c.balance||0),0);
  // Pending invoices
  const pendingInv=DB.get('invoices').filter(i=>i.status!=='paid').reduce((a,i)=>a+i.amount,0);
  return {periodSales,totalSales,totalExp,profit:totalSales-totalExp,expByCat,salesByCust,stockVal,dues,pendingInv};
}

function downloadTally(format,period,label){
  const sales=DB.get('sales').filter(s=>s.date.slice(0,period.length)===period);
  const exp=DB.get('expenses').filter(e=>e.date.slice(0,period.length)===period);
  const customers=DB.get('customers');
  const inv=DB.get('inventory');
  let content='',filename='',mime='text/plain';

  if(format==='csv'){
    filename='tally-vouchers-'+period+'.csv'; mime='text/csv';
    const rows=[['Date','Voucher Type','Voucher No','Ledger Name','Debit','Credit','Narration']];
    sales.forEach(s=>{ rows.push([s.date,'Sales',s.id.slice(-6),custName(s.customerId),'',s.total,'Sale - '+s.items.map(i=>i.name).join('; ')]); rows.push([s.date,'Sales',s.id.slice(-6),'Sales Account',s.total,'','']); });
    exp.forEach(e=>{ rows.push([e.date,'Payment','EXP'+e.id.slice(-4),e.category,'',e.amount,e.desc]); rows.push([e.date,'Payment','EXP'+e.id.slice(-4),'Cash/Bank',e.amount,'','']); });
    content=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\\n');
  } else if(format==='xml'){
    filename='tally-vouchers-'+period+'.xml'; mime='application/xml';
    content='<ENVELOPE>\\n<HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER>\\n<BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME></REQUESTDESC><REQUESTDATA>\\n';
    sales.forEach(s=>{ content+=`<TALLYMESSAGE><VOUCHER VCHTYPE="Sales" DATE="${s.date.replace(/-/g,'')}" ACTION="Create"><PARTYLEDGERNAME>${escapeXml(custName(s.customerId))}</PARTYLEDGERNAME><NARRATION>${escapeXml(s.items.map(i=>i.name).join('; '))}</NARRATION><ALLLEDGERENTRIES.LIST><LEDGERNAME>${escapeXml(custName(s.customerId))}</LEDGERNAME><ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>${s.total}</AMOUNT></ALLLEDGERENTRIES.LIST><ALLLEDGERENTRIES.LIST><LEDGERNAME>Sales Account</LEDGERNAME><ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE><AMOUNT>${s.total}</AMOUNT></ALLLEDGERENTRIES.LIST></VOUCHER></TALLYMESSAGE>\\n`; });
    exp.forEach(e=>{ content+=`<TALLYMESSAGE><VOUCHER VCHTYPE="Payment" DATE="${e.date.replace(/-/g,'')}" ACTION="Create"><NARRATION>${escapeXml(e.desc)}</NARRATION><ALLLEDGERENTRIES.LIST><LEDGERNAME>${escapeXml(e.category)}</LEDGERNAME><ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE><AMOUNT>${e.amount}</AMOUNT></ALLLEDGERENTRIES.LIST><ALLLEDGERENTRIES.LIST><LEDGERNAME>Cash/Bank</LEDGERNAME><ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>${e.amount}</AMOUNT></ALLLEDGERENTRIES.LIST></VOUCHER></TALLYMESSAGE>\\n`; });
    content+='</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>';
  } else if(format==='journal'){
    filename='journal-entries-'+period+'.txt'; mime='text/plain';
    content=`JOURNAL ENTRIES — ${escapeHtml(label)}\\n${'='.repeat(50)}\\n\\n`;
    sales.forEach(s=>{ content+=`Date: ${s.date}\\nDr. ${custName(s.customerId)}        ${fmtINR(s.total)}\\n    Cr. Sales Account              ${fmtINR(s.total)}\\n    (Being: ${s.items.map(i=>i.name).join(', ')})\\n\\n`; });
    exp.forEach(e=>{ content+=`Date: ${e.date}\\nDr. ${e.category}            ${fmtINR(e.amount)}\\n    Cr. Cash/Bank                  ${fmtINR(e.amount)}\\n    (Being: ${e.desc})\\n\\n`; });
  } else if(format==='masters'){
    filename='tally-masters-'+period+'.csv'; mime='text/csv';
    content='Type,Name,Parent,OpeningBalance,GSTIN,Phone\\n';
    customers.forEach(c=>content+=`Sundry Debitor,${escapeCsv(c.name)},Sundry Debtors,${c.balance||0},${c.gstin||''},${c.phone||''}\\n`);
    inv.forEach(i=>content+=`Stock Item,${escapeCsv(i.name)},Stock Items,${i.qty*i.cost},,\\n`);
    const cats={}; exp.forEach(e=>cats[e.category]=1); Object.keys(cats).forEach(c=>content+=`Indirect Expense,${escapeCsv(c)},Indirect Expenses,0,,\\n`);
  }
  const blob=new Blob([content],{type:mime});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  toast(filename+' downloaded!','success');
}
function escapeXml(s){ return String(s||'').replace(/[<>&'"]/g,m=>({'<':'<','>':'>','&':'&',"'":'&#39;','"':'"'}[m])); }
function escapeCsv(s){ return '"'+String(s||'').replace(/"/g,'""')+'"'; }

// --- Drag & drop handlers ---
function setupDragDrop(){
  const zone=document.getElementById('upload-zone');
  if(!zone) return;
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{
    e.preventDefault();zone.classList.remove('dragover');
    const f=e.dataTransfer.files[0];
    if(f) parseBankCSV(f);
  });
}

function handleFileUpload(e){
  const f=e.target.files[0];
  if(f) parseBankCSV(f);
}

// --- CSV Parser ---
function parseBankCSV(file){
  const reader=new FileReader();
  reader.onload=function(e){
    const text=e.target.result;
    const rows=parseCSVRows(text);
    if(rows.length<2){ toast('CSV appears empty or invalid','error'); return; }
    // Auto-detect header row and columns
    const mapped=detectColumns(rows);
    if(!mapped){ toast('Could not detect transaction columns. Please check CSV format.','error'); return; }
    // Parse transactions
    const txns=[];
    for(let i=mapped.dataStart;i<rows.length;i++){
      const r=rows[i];
      if(!r||r.length<2) continue;
      const date=r[mapped.dateIdx]||'';
      const desc=r[mapped.descIdx]||'';
      const debit=parseAmt(r[mapped.debitIdx]);
      const credit=parseAmt(r[mapped.creditIdx]);
      const amount=credit>0?credit:debit;
      if(!date||(!debit&&!credit)) continue;
      txns.push({
        id:DB.uid(),
        date:normalizeDate(date),
        desc:desc.trim(),
        debit:debit,
        credit:credit,
        amount:amount,
        type:credit>0?'credit':'debit',
        category:autoCategorize(desc)
      });
    }
    if(!txns.length){ toast('No valid transactions found in CSV','error'); return; }
    const stmt={filename:file.name,uploadedAt:new Date().toISOString(),txns:txns,bankName:mapped.bankName||'Unknown Bank'};
    DB.set('bank_stmt',stmt);
    toast('Loaded '+txns.length+' transactions from '+file.name+'!','success');
    switchView('bankstmt');
  };
  reader.readAsText(file,'UTF-8');
}

function parseCSVRows(text){
  // Handle different line endings and quotes
  const lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  return lines.map(l=>{
    // Simple CSV parser with quote support
    const result=[]; let cur=''; let inQ=false;
    for(let i=0;i<l.length;i++){
      const c=l[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===','&&!inQ){ result.push(cur); cur=''; continue; }
      cur+=c;
    }
    result.push(cur);
    return result.map(s=>s.trim());
  });
}

function parseAmt(s){
  if(!s) return 0;
  s=String(s).replace(/[^0-9.\-]/g,'');
  const v=parseFloat(s);
  return isNaN(v)?0:Math.abs(v);
}

function normalizeDate(d){
  if(!d) return '';
  // Try DD/MM/YYYY → YYYY-MM-DD
  const m1=d.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m1){
    let dd=m1[1].padStart(2,'0'), mm=m1[2].padStart(2,'0'), yy=m1[3];
    if(yy.length===2) yy='20'+yy;
    return yy+'-'+mm+'-'+dd;
  }
  // Try DD-MM-YY
  const m2=d.match(/(\d{1,2})[\-](\d{1,2})[\-](\d{2})/);
  if(m2){ return '20'+m2[3]+'-'+m2[2].padStart(2,'0')+'-'+m2[1].padStart(2,'0'); }
  return d;
}

function detectColumns(rows){
  // Find header row (contains date/description/debit/credit keywords)
  for(let i=0;i<Math.min(10,rows.length);i++){
    const r=rows[i].map(c=>c.toLowerCase().replace(/[^a-z]/g,''));
    let dateIdx=-1,descIdx=-1,debitIdx=-1,creditIdx=-1,bankName='';
    for(let j=0;j<r.length;j++){
      const h=r[j];
      if(dateIdx<0&&(h.includes('date')||h.includes('txndate')||h.includes('valuedate'))) dateIdx=j;
      if(descIdx<0&&(h.includes('desc')||h.includes('narration')||h.includes('particular')||h.includes('details')||h.includes('remark'))) descIdx=j;
      if(debitIdx<0&&(h.includes('debit')||h.includes('withdrawal')||h.includes('dr')||h.includes('paidout'))) debitIdx=j;
      if(creditIdx<0&&(h.includes('credit')||h.includes('deposit')||h.includes('cr')||h.includes('received'))) creditIdx=j;
    }
    // If we found date + description + at least one of debit/credit
    if(dateIdx>=0&&descIdx>=0&&(debitIdx>=0||creditIdx>=0)){
      // If only one amount column, treat it as both
      if(debitIdx<0&&creditIdx>=0) debitIdx=creditIdx;
      if(creditIdx<0&&debitIdx>=0) creditIdx=debitIdx;
      // Detect bank name from header
      const fullText=rows.slice(0,Math.min(5,rows.length)).join(' ').toLowerCase();
      if(fullText.includes('hdfc')) bankName='HDFC Bank';
      else if(fullText.includes('sbi')||fullText.includes('state bank')) bankName='State Bank of India';
      else if(fullText.includes('icici')) bankName='ICICI Bank';
      else if(fullText.includes('axis')) bankName='Axis Bank';
      else if(fullText.includes('kotak')) bankName='Kotak Mahindra';
      else if(fullText.includes('baroda')||fullText.includes('bob')) bankName='Bank of Baroda';
      return {dateIdx,descIdx,debitIdx,creditIdx,dataStart:i+1,bankName};
    }
  }
  // Fallback: try common positional format (date, desc, debit, credit, balance)
  if(rows.length>1&&rows[1].length>=4){
    return {dateIdx:0,descIdx:1,debitIdx:2,creditIdx:3,dataStart:1,bankName:'Auto-detected'};
  }
  return null;
}

// --- Auto-categorization engine ---
const TXN_CATEGORIES=[
  'Salary Income','Business Sales','Interest Income','Dividend Income','Other Income',
  'Rent Paid','Salaries & Wages','Raw Materials','Electricity & Utilities','Telephone & Internet',
  'Transport & Fuel','Office Supplies','Marketing & Advertising','Professional Fees','Bank Charges',
  'Loan/EMI Payment','Insurance Premium','Tax Payment (GST/TDS)','Equipment Purchase',
  'Cash Withdrawal','Transfer to Other Account','Personal Expense','Miscellaneous Expense'
];

function autoCategorize(desc){
  const d=desc.toLowerCase();
  // Income categories
  if(d.includes('salary')||d.includes('payroll')) return 'Salary Income';
  if(d.includes('interest')||d.includes('int paid')||d.includes('savings')) return 'Interest Income';
  if(d.includes('dividend')) return 'Dividend Income';
  if(d.includes('utr')||d.includes('payment received')||d.includes('from ')||d.includes('credited')||d.includes('neft')||d.includes('rtgs')||d.includes('imps')) return 'Business Sales';
  if(d.includes('refund')||d.includes('cashback')||d.includes('reward')) return 'Other Income';
  // Expense categories
  if(d.includes('rent')) return 'Rent Paid';
  if(d.includes('electric')||d.includes('water')||d.includes('gas bill')||d.includes('utility')) return 'Electricity & Utilities';
  if(d.includes('phone')||d.includes('mobile')||d.includes('internet')||d.includes('broadband')||d.includes('airtel')||d.includes('jio')) return 'Telephone & Internet';
  if(d.includes('fuel')||d.includes('petrol')||d.includes('diesel')||d.includes('transport')||d.includes('uber')||d.includes('ola')) return 'Transport & Fuel';
  if(d.includes('stationary')||d.includes('office')||d.includes('supplies')) return 'Office Supplies';
  if(d.includes('advertis')||d.includes('marketing')||d.includes('promot')) return 'Marketing & Advertising';
  if(d.includes('legal')||d.includes('professional fee')||d.includes('consult')||d.includes('ca ')||d.includes('audit')) return 'Professional Fees';
  if(d.includes('charge')||d.includes('fee')||d.includes('gst on')||d.includes('min bal')||d.includes('penal')) return 'Bank Charges';
  if(d.includes('emi')||d.includes('loan')||d.includes('lender')) return 'Loan/EMI Payment';
  if(d.includes('insurance')||d.includes('premium')) return 'Insurance Premium';
  if(d.includes('gst')||d.includes('tds')||d.includes('income tax')||d.includes('tax payment')) return 'Tax Payment (GST/TDS)';
  if(d.includes('atm')||d.includes('cash withdrawal')||d.includes('cash withdraw')) return 'Cash Withdrawal';
  if(d.includes('upi')||d.includes('payment to')||d.includes('paid to')||d.includes('debit')) return 'Miscellaneous Expense';
  return 'Miscellaneous Expense';
}

// --- ITR Balance Sheet Generator ---
function generateITRBalanceSheet(){
  const stmt=DB.get('bank_stmt');
  if(!stmt||!stmt.txns.length){ toast('No bank statement loaded','error'); return; }
  const s=DB.get('settings');
  const txns=stmt.txns;
  // Group by category
  const cats={};
  txns.forEach(t=>{
    if(!cats[t.category]) cats[t.category]={debit:0,credit:0,count:0};
    cats[t.category].debit+=t.debit;
    cats[t.category].credit+=t.credit;
    cats[t.category].count++;
  });
  // Split into income and expense categories
  const incomeCats=[], expenseCats=[];
  Object.entries(cats).forEach(([cat,v])=>{
    if(v.credit>v.debit) incomeCats.push({name:cat,...v});
    else expenseCats.push({name:cat,...v});
  });
  const totalIncome=incomeCats.reduce((a,c)=>a+c.credit,0);
  const totalExpenses=expenseCats.reduce((a,c)=>a+c.debit,0);
  const netProfit=totalIncome-totalExpenses;
  // Calculate balance from transactions
  const closingBalance=txns.reduce((a,t)=>a+t.credit-t.debit,0);
  // Generate dates range
  const dates=txns.map(t=>t.date).filter(d=>d).sort();
  const fromDate=dates[0]||today();
  const toDate=dates[dates.length-1]||today();
  const ay='AY '+(new Date(toDate).getFullYear()+1);
  // Build the ITR HTML
  openModal(`
    <div class="modal-hd"><h3>ITR Balance Sheet Preview</h3><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-bd" style="max-height:65vh">
      <div style="background:var(--navy);color:#fff;padding:16px;border-radius:10px;margin-bottom:16px;text-align:center">
        <div style="font-size:16px;font-weight:800">${escapeHtml(s.businessName||'My Business')}</div>
        <div style="font-size:12px;opacity:.7;margin-top:2px">GSTIN: ${escapeHtml(s.businessGstin||'N/A')} | ${escapeHtml(stmt.bankName)}</div>
        <div style="font-size:13px;margin-top:4px">Assessment Year: ${ay} | Period: ${fmtDate(fromDate)} to ${fmtDate(toDate)}</div>
      </div>
      <div style="overflow-x:auto">
        <table class="itr-table">
          <thead><tr><th>Particulars</th><th class="num">Amount (₹)</th></tr></thead>
          <tbody>
            <tr class="itr-section"><td colspan="2">Profit & Loss Account — Income</td></tr>
            ${incomeCats.map(c=>`<tr><td style="padding-left:28px">${escapeHtml(c.name)}</td><td class="num">${c.credit.toLocaleString('en-IN')}</td></tr>`).join('')}
            <tr class="itr-subtotal"><td>Total Income</td><td class="num">${totalIncome.toLocaleString('en-IN')}</td></tr>
            <tr class="itr-section"><td colspan="2">Profit & Loss Account — Expenses</td></tr>
            ${expenseCats.map(c=>`<tr><td style="padding-left:28px">${escapeHtml(c.name)}</td><td class="num">${c.debit.toLocaleString('en-IN')}</td></tr>`).join('')}
            <tr class="itr-subtotal"><td>Total Expenses</td><td class="num">${totalExpenses.toLocaleString('en-IN')}</td></tr>
            <tr class="itr-total"><td>Net Profit / (Loss) for the Year</td><td class="num ${netProfit>=0?'':'text-red'}">${netProfit.toLocaleString('en-IN')}</td></tr>
            <tr class="itr-section"><td colspan="2">Balance Sheet — Assets</td></tr>
            <tr><td style="padding-left:28px">Cash & Bank Balance (Closing)</td><td class="num">${closingBalance.toLocaleString('en-IN')}</td></tr>
            <tr><td style="padding-left:28px">Net Profit (transferred from P&L)</td><td class="num">${netProfit.toLocaleString('en-IN')}</td></tr>
            <tr class="itr-subtotal"><td>Total Assets</td><td class="num">${(closingBalance+netProfit).toLocaleString('en-IN')}</td></tr>
            <tr class="itr-section"><td colspan="2">Balance Sheet — Liabilities & Capital</td></tr>
            <tr><td style="padding-left:28px">Capital Account (Opening Balance)</td><td class="num">${(closingBalance+netProfit>0?(closingBalance+netProfit).toLocaleString('en-IN'):'0')}</td></tr>

          </tbody>

      </div>
      <div style="font-size:11px;color:var(--text-mute);margin-top:12px;text-align:center">

      </div>
    </div>

      <button class="btn btn-outline" onclick="sendITRWhatsApp()">📤 WhatsApp</button>

    </div>
  `);

    </div></div>
    <div class="card"><div class="card-hd"><h3>About the API</h3></div><div class="card-bd"><p class="fs-12 text-dim">Exchange rates from Frankfurter API — a free, open-source API sourcing data from 84 central banks. No API key required. <a href="https://frankfurter.dev" target="_blank">Visit frankfurter.dev</a></p></div></div>
  </div>`;
};
function convertCurrency(){
  const amt=+document.getElementById('cur-amount').value||0;
  const from=document.getElementById('cur-from').value;
  const to=document.getElementById('cur-to').value;
  if(from===to){ document.getElementById('cur-result').textContent=fmtINR(amt).replace('₹','')+' '+from; return; }
  document.getElementById('cur-result').textContent='Loading...';
  fetch('https://api.frankfurter.dev/v1/latest?base='+from+'&symbols='+to)
    .then(r=>r.json()).then(d=>{
      const rate=d.rates[to];
      const result=(amt*rate).toFixed(2);
      document.getElementById('cur-result').textContent=result+' '+to;
      document.getElementById('cur-table').innerHTML=`<div style="text-align:center;color:var(--text-dim);margin-top:8px">1 ${from} = ${rate} ${to} · Updated ${d.date}</div>`;

function processAIQuery(q){

    return aiCreateInvoice(q,custs);
  }
  // ===== AI ACTION: CREATE SALE =====
  if((q.includes('create')||q.includes('record')||q.includes('add')||q.includes('log'))&&q.includes('sale')){
    return aiCreateSale(q,custs,inv);
  }

  }

  if((q.includes('create')||q.includes('make')||q.includes('generate'))&&(q.includes('quot')||q.includes('quote'))){
    return aiCreateQuotation(q,custs);
  }

  if(q.includes('daily')||q.includes('summary')||q.includes('today')){

  if(q.includes('profit')||q.includes('month')){

    const me=exp.filter(e=>e.date.slice(0,7)===today().slice(0,7)).reduce((a,e)=>a+e.amount,0);

    return `Total expenses: ${fmtINR(total)}\n\nTop categories:\n${top.map(([c,v])=>'• '+c+': '+fmtINR(v)).join('\n')}`;

  if(q.includes('stock')||q.includes('inventory')||q.includes('low')){

  }
  if(q.includes('top customer')||q.includes('best customer')){

    const top=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);

  }
  if(q.includes('overdue')||q.includes('invoice')||q.includes('pending payment')){

    return `Namaste! I'm your AI business assistant. I can create invoices, record sales, add expenses, make quotations, and analyze your business data.\n\nTry: "Create invoice for Rajesh 15000" or "daily summary"!`;

  return `I didn't quite catch that. Here's what I can do:\n\n✨ Create: "Create invoice for Rajesh 15000", "Add expense 5000 rent"\n📊 Analyze: "daily summary", "total sales", "profit", "low stock"\n👥 Look up: "top customers", "overdue invoices"\n\nTry one of those!`;
}

// ===== AI NLP: Parse customer name from command =====
function aiFindCustomer(q,custs){
  // Try exact name match first
  for(const c of custs){
    if(q.includes(c.name.toLowerCase())) return c;
  }
  // Try company name
  for(const c of custs){
    if(c.company&&q.includes(c.company.toLowerCase())) return c;
  }
  // Try first name match
  for(const c of custs){
    const first=c.name.split(' ')[0].toLowerCase();
    if(first.length>2&&q.includes(first)) return c;
  }
  // Try to extract a name after 'for'
  const forMatch=q.match(/(?:for|to)\s+([a-z]{2,}(?:\s+[a-z]+){0,2})/);
  if(forMatch){
    const name=forMatch[1].trim();
    // Check if this extracted name partially matches any customer
    for(const c of custs){
      if(c.name.toLowerCase().includes(name)) return c;
    }
    return {__new:true,customerName:name};
  }
  return null;
}
// ===== AI NLP: Extract amount from text =====
function aiExtractAmount(q){
  const patterns=[
    /(?:rs\.?|₹|amount|amt|for|of|valuing|worth)\s*:?\s*(\d+[,.]?\d*)/,
    /(\d[\d,]*)\s*(?:rupees|rs|inr)/,
    /(\d[\d,]*)\s*(?:due|payable|total)/
  ];
  for(const p of patterns){
    const m=q.match(p);
    if(m){ return parseInt(m[1].replace(/[,.]/g,''))||0; }
  }
  const nums=q.match(/\d[\d,]*/g);
  if(nums){ return Math.max(...nums.map(n=>parseInt(n.replace(/,/g,'')))); }
  return 0;
}
// ===== AI NLP: Extract due days =====
function aiExtractDueDays(q){
  const m=q.match(/(?:due|pay)\s*(?:in)?\s*(\d+)\s*days/);
  if(m) return parseInt(m[1]);
  if(q.includes('due tomorrow')||q.includes('due in 1 day')) return 1;
  if(q.includes('due next week')||q.includes('due in 7 days')) return 7;
  if(q.includes('due next month')||q.includes('due in 30 days')) return 30;
  return 15;
}
// ===== AI NLP: Extract items/description =====
function aiExtractItems(q){
  const forMatch=q.match(/(?:for|items?)\s+([\w\s,]+?)(?:\s+(?:amount|rs|₹|due|valuing|worth|of|total)|$)/);
  if(forMatch&&forMatch[1].trim().length>2){
    return forMatch[1].trim().replace(/\s+/g,' ').slice(0,100);
  }
  let clean=q.replace(/(?:create|make|generate|issue|bill|record|add|log)\s*(?:an?|the)?\s*(?:invoice|bill|sale|expense|quotation|quote)?\s*(?:for|to)?/,'');
  clean=clean.replace(/(?:rs\.?|₹|amount|amt|valuing|worth|of)\s*:?\s*\d+[,.]?\d*/g,'');
  clean=clean.replace(/\d+[,.]?\d*\s*(?:rupees|rs|inr|due|payable)/g,'');
  clean=clean.replace(/(?:due|pay)\s*(?:in)?\s*\d+\s*days/g,'');
  clean=clean.replace(/(?:due|tomorrow|next week|next month)/g,'');
  clean=clean.replace(/\s+/g,' ').trim();
  return clean.length>2?clean.slice(0,100):'Goods & Services';
}

}

// ===== ROUTER =====
const TITLES={dashboard:'Dashboard',ai:'Mizlish AI',daily:'Daily Summary',sales:'Sales',expenses:'Expenses',invoices:'Invoices',quotations:'Quotations',reminders:'Reminders',customers:'Customers',inventory:'Inventory',reports:'Reports',balance:'Balance Sheet',tally:'Tally Export',auditor:'Auditor Kit',bankstmt:'Bank → ITR',currency:'Currency Converter',settings:'Settings'};

function switchView(name){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  document.getElementById('page-title').textContent=TITLES[name]||name;
  document.getElementById('content').innerHTML=VIEWS[name]();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const v=document.querySelector('.view'); if(v) v.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  // Post-render hooks
  if(name==='dashboard') renderDashCharts();
  if(name==='reports') renderReportCharts();
  if(name==='currency') convertCurrency();
  if(name==='balance') switchBSPeriod('year');
  if(name==='tally') switchTallyPeriod('year');
  if(name==='bankstmt') setTimeout(setupDragDrop,50);
  window.scrollTo(0,0);
}
function refreshView(){ const active=document.querySelector('.nav-item.active'); if(active) switchView(active.dataset.view); }

function renderDashCharts(){
  const sales=DB.get('sales'),exp=DB.get('expenses');
  const ctx=document.getElementById('dashChart1'); if(!ctx)return;
  const days=7; const labels=[]; const sData=[]; const eData=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10); labels.push(d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})); sData.push(sales.filter(s=>s.date===ds).reduce((a,s)=>a+s.total,0)); eData.push(exp.filter(e=>e.date===ds).reduce((a,e)=>a+e.amount,0)); }
  new Chart(ctx,{type:'bar',data:{labels,datasets:[{label:'Sales',data:sData,backgroundColor:'#1AB8FC',borderRadius:6},{label:'Expenses',data:eData,backgroundColor:'#E4248F',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11}}}},scales:{y:{ticks:{callback:v=>'₹'+v/1000+'k'},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}}});
}
function renderReportCharts(){
  const sales=DB.get('sales'),exp=DB.get('expenses');
  // Chart 1: Sales trend
  const c1=document.getElementById('repChart1'); if(c1){
    const days=14; const labels=[]; const sData=[];
    for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10); labels.push(d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})); sData.push(sales.filter(s=>s.date===ds).reduce((a,s)=>a+s.total,0)); }
    new Chart(c1,{type:'line',data:{labels,datasets:[{label:'Sales',data:sData,borderColor:'#1AB8FC',backgroundColor:'rgba(26,184,252,.1)',fill:true,tension:.3,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'₹'+v},grid:{color:'#f1f5f9'}}}}});
  }
  // Chart 2: Expense pie
  const c2=document.getElementById('repChart2'); if(c2){
    const cats={}; exp.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);
    new Chart(c2,{type:'doughnut',data:{labels:Object.keys(cats),datasets:[{data:Object.values(cats),backgroundColor:['#1AB8FC','#6C21C7','#E4248F','#0E94D9','#B81A72','#541A9E','#8F64FA','#051D4F']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{boxWidth:12,font:{size:11}}}}}});
  }
  // Chart 3: Monthly
  const c3=document.getElementById('repChart3'); if(c3){
    const months=[]; const ms=[]; const me=[];
    for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); const m=d.toISOString().slice(0,7); months.push(d.toLocaleDateString('en-IN',{month:'short'})); ms.push(sales.filter(s=>s.date.slice(0,7)===m).reduce((a,s)=>a+s.total,0)); me.push(exp.filter(e=>e.date.slice(0,7)===m).reduce((a,e)=>a+e.amount,0)); }
    new Chart(c3,{type:'bar',data:{labels:months,datasets:[{label:'Sales',data:ms,backgroundColor:'#1AB8FC',borderRadius:6},{label:'Expenses',data:me,backgroundColor:'#E4248F',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>'₹'+v/1000+'k'}}}}});
  }
}

function updateBadges(){
  const inv=DB.get('invoices').filter(i=>i.status!=='paid').length;
  const rem=DB.get('reminders').filter(r=>r.status==='pending').length;
  const ib=document.getElementById('inv-badge'); if(inv>0){ ib.textContent=inv; ib.style.display='inline'; } else { ib.style.display='none'; }
  const rb=document.getElementById('rem-badge'); if(rem>0){ rb.textContent=rem; rb.style.display='inline'; } else { rb.style.display='none'; }
  const nd=document.getElementById('notif-dot'); nd.style.display=rem>0?'block':'none';
}

seedData();
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
document.getElementById('global-search').addEventListener('input',e=>{ /* could implement global search */ });
switchView('dashboard');
updateBadges();

</script>
